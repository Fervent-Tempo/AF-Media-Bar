<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>{{STYLE}}</style></head>
<body>
<svg viewBox="0 0 64 64" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <g id="pose"><g id="breath"><g id="character">
    <path id="body" d="{{BODY_PATH}}" fill="#FFFFFF"/>
    <g id="gaze"><g id="lids">
      <path id="eye-left" d="M21 26 Q24 23 27 26 L27 36 Q24 39 21 36 Z" fill="#1C1C1C"/>
      <path id="eye-right" d="M37 26 Q40 23 43 26 L43 36 Q40 39 37 36 Z" fill="#1C1C1C"/>
    </g></g>
  </g>
  <g id="effects" transform="translate(32 34)" opacity="0" stroke-linecap="round" stroke-linejoin="round">
    <g id="fx-dots"><circle cx="-11" r="3"/><circle r="3"/><circle cx="11" r="3"/></g>
    <g id="fx-orbit" fill="none" stroke-width="3"><ellipse rx="23" ry="9"/><ellipse rx="23" ry="9" transform="rotate(60)"/><ellipse rx="23" ry="9" transform="rotate(120)"/><circle id="orbit-dot" cx="23" r="3"/></g>
    <g id="fx-radar" fill="none" stroke-width="2"><circle r="23" opacity="0.4"/><circle r="14" opacity="0.4"/><path id="radar-sweep" d="M0 0 L0 -23 A23 23 0 0 1 23 0 Z"/><circle cx="10" cy="-11" r="2"/><circle cx="-12" cy="8" r="2"/></g>
    <g id="fx-progress" fill="none" stroke-width="5"><circle r="21" opacity="0.22"/><circle id="progress-arc" r="21" pathLength="100" transform="rotate(-90)" stroke-dasharray="50 100"/></g>
    <g id="fx-gather"><circle cx="-18" cy="-16" r="4"/><circle cx="18" cy="-16" r="4"/><circle cx="-18" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><circle r="6"/></g>
    <g id="fx-humming" fill="none" stroke-width="3"><path d="M-8 -4 L-8 -14 L1 -17 L1 -7 M10 5 L10 -8 L18 -10"/><circle cx="-11" cy="-3" r="3"/><circle cx="-2" cy="-6" r="3"/><circle cx="7" cy="6" r="3"/></g>
    <g id="fx-loading" fill="none" stroke-width="4"><path d="M-19 0 A19 19 0 1 1 0 19"/><path d="M-10 0 A10 10 0 1 0 0 -10"/></g>
    <g id="fx-dictating" stroke-width="4"><path d="M-20 -4 V4"/><path d="M-10 -10 V10"/><path d="M0 -18 V18"/><path d="M10 -10 V10"/><path d="M20 -4 V4"/></g>
    <g id="fx-writing" fill="none" stroke-width="3"><path d="M-19 17 H20" opacity="0.4"/><g id="pencil"><path d="M-10 10 L4 -17 L12 -13 L-2 14 Z"/><path d="M-10 10 L-12 18 L-2 14 M2 -13 L9 -9"/></g></g>
    <g id="fx-sending" fill="none" stroke-width="3"><path d="M-21 -9 L22 -21 L9 22 L1 3 Z M1 3 L22 -21"/></g>
    <g id="fx-receiving" fill="none" stroke-width="3"><path d="M-21 9 L-15 19 H15 L21 9 M-18 9 H-9 L-5 14 H5 L9 9 H18"/><path id="receive-arrow" d="M0 -21 V4 M-8 -4 L0 4 L8 -4"/></g>
    <g id="fx-uploading" fill="none" stroke-width="3"><path d="M-21 8 V19 H21 V8"/><path id="upload-arrow" d="M0 8 V-20 M-9 -11 L0 -20 L9 -11"/></g>
    <g id="fx-notifying"><circle cx="18" cy="-20" r="5"/><circle id="notify-ring" cx="18" cy="-20" r="8" fill="none" stroke-width="1.5"/></g>
    <g id="fx-alerting" fill="none" stroke-width="3"><path d="M-3 -21 H3 L2 6 H-2 Z"/><circle cy="17" r="3"/></g>
    <g id="fx-bouncing"><circle id="bounce-ball" r="13"/><ellipse cy="23" rx="16" ry="2" opacity="0.2"/></g>
    <g id="fx-powering-down" fill="none" stroke-width="4"><path d="M-11 -16 A21 21 0 1 0 11 -16 M0 -23 V-4"/></g>
  </g>
  <g id="particles" opacity="0">{{PARTICLES}}</g>
  </g></g>
</svg>
<script>{{MOTION}}
{{EFFECTS}}
{{SCRIPT}}</script>
</body></html>
