<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>{{STYLE}}</style></head>
<body>
<svg viewBox="0 0 64 64" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="pet-clip"><path id="body-clip" d="{{BODY_PATH}}"/></clipPath>
    <linearGradient id="ribbon-ink-0"><stop stop-color="#F4B55F"/><stop offset="1" stop-color="#DC69BC"/></linearGradient>
    <linearGradient id="ribbon-ink-1"><stop stop-color="#67D5B5"/><stop offset="1" stop-color="#6AA4EA"/></linearGradient>
    <linearGradient id="ribbon-ink-2"><stop stop-color="#B18AE8"/><stop offset="1" stop-color="#E77993"/></linearGradient>
  </defs>
  <g id="stage">
    <g id="ribbons-back" fill="none" stroke-linecap="round"><path id="ribbon-back-0"/><path id="ribbon-back-1"/><path id="ribbon-back-2"/></g>
    <g id="pose"><g id="breath"><g id="character">
      <path id="body" d="{{BODY_PATH}}" fill="#FFFFFF"/>
      <g clip-path="url(#pet-clip)"><g id="gaze"><g id="lids">
        <path id="eye-left" fill="#1C1C1C"/>
        <path id="eye-right" fill="#1C1C1C"/>
      </g></g></g>
    </g></g></g>
    <g id="effects" transform="translate(32 34)" stroke-linecap="round" stroke-linejoin="round">
      <g id="fx-dots"><circle id="think-left" r="5"/><circle id="think-right" r="5"/></g>
      <g id="fx-orbit"><circle id="orbit-0"/><circle id="orbit-1"/><circle id="orbit-2"/><circle id="orbit-3"/><circle id="orbit-4"/></g>
      <g id="fx-radar" fill="none" stroke-width="1"><circle id="radar-0"/><circle id="radar-1"/><circle id="radar-2"/></g>
      <g id="fx-progress" fill="none" stroke-width="1.7"><circle r="18" opacity="0.18"/><circle id="progress-arc" r="18" pathLength="100" transform="rotate(-90)"/></g>
      <g id="fx-spawning"><circle id="gather-0"/><circle id="gather-1"/><circle id="gather-2"/><circle id="gather-3"/><circle id="gather-4"/></g>
      <g id="fx-humming"/><g id="fx-loading"/>
      <g id="fx-dictating"><circle id="wave-0"/><circle id="wave-1"/><circle id="wave-2"/><circle id="wave-3"/></g>
      <g id="fx-writing"><path id="pencil-tip" d="M-2.8 -2 L2.8 -2 L0 3 Z"/><path id="writing-ink" fill="none" stroke-width="1.7"/></g>
      <g id="fx-sending"><circle id="send-main"/><circle id="send-tail"/><circle id="send-ring" fill="none" stroke-width="1"/></g>
      <g id="fx-receiving"><circle id="receive-main"/><circle id="receive-ring" fill="none" stroke-width="1"/></g>
      <g id="fx-uploading"><circle id="upload-0"/><circle id="upload-1"/></g>
      <g id="fx-notifying"><circle id="notify-badge" cx="17" cy="-19" r="5"/></g>
      <g id="fx-alerting"><circle cy="16" r="3.5"/></g>
      <g id="fx-bouncing"><ellipse cy="21" rx="11" ry="1.5" opacity="0.18"/></g>
      <g id="fx-powering-down"><circle id="power-halo" r="9" opacity="0.12"/><circle id="power-ring" fill="none" stroke-width="0.8"/></g>
    </g>
    <g id="ribbons-front" fill="none" stroke-linecap="round"><path id="ribbon-front-0"/><path id="ribbon-front-1"/><path id="ribbon-front-2"/></g>
    <g id="particles" opacity="0">{{PARTICLES}}</g>
  </g>
</svg>
<script>{{GEOMETRY}}
{{MOTION}}
{{EFFECTS}}
{{SCRIPT}}</script>
</body></html>
