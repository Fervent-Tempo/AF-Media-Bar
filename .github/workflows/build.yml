name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    name: Release build (win-x64)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore .\AFMediaBar.slnx

      - name: Build
        run: dotnet build .\AFMediaBar.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test components
        run: dotnet test .\tests\AFMediaBar.Components.Tests\AFMediaBar.Components.Tests.csproj -c Release --no-build --no-restore

      - name: Test core and layout
        run: dotnet test .\tests\AFMediaBar.Core.Tests\AFMediaBar.Core.Tests.csproj -c Release --no-build --no-restore

      - name: Validate self-contained single-file publish
        run: dotnet publish .\src\AFMediaBar\AFMediaBar.csproj -c Release -r win-x64 --self-contained true --no-restore -p:ContinuousIntegrationBuild=true -o .\artifacts\AFMediaBar-win-x64

      - name: Verify single-file output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem .\artifacts\AFMediaBar-win-x64 -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "AFMediaBar.exe") {
            throw "Expected only AFMediaBar.exe, found: $($files.Name -join ', ')"
          }
