name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    name: Release build (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify release metadata generation and promotion guards
        shell: pwsh
        run: ./tools/verify-release-metadata.ps1
      - name: Verify contributor snapshot generation
        shell: pwsh
        run: ./tools/verify-contributors-snapshot.ps1

      - name: Restore
        run: dotnet restore .\src\AFMediaBar.slnx -r win-x64

      - name: Build
        run: dotnet build .\src\AFMediaBar.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:BuildInParallel=false

      - name: Test layout, policies and settings
        run: dotnet test .\tests\AFMediaBar.Layout.Tests\AFMediaBar.Layout.Tests.csproj -c Release --no-build --no-restore

      - name: Validate self-contained single-file publish
        run: dotnet publish .\src\AFMediaBar\AFMediaBar.csproj -c Release -r win-x64 --self-contained true --no-restore -p:ContinuousIntegrationBuild=true -p:BuildInParallel=false -o .\artifacts\publish

      - name: Verify single-file output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem .\artifacts\publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "AFMediaBar.exe") {
            throw "Expected only AFMediaBar.exe, found: $($files.Name -join ', ')"
          }

      # 安装包与单文件发布共用同一条链路：脚本自己校验发布目录只有 AFMediaBar.exe，并在这里编译安装包。
      # The installer shares one chain with the single-file publish: the script asserts the publish directory
      # holds only AFMediaBar.exe and then compiles the installer.
      - name: Build installer
        shell: pwsh
        run: .\installer\build-installer.ps1 -SkipPublish -EnsureIscc

      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem .\artifacts -Filter 'AFMediaBar-Setup-*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer, found: $($installers.Name -join ', ')"
          }
          Get-Content .\artifacts\installer-sha256.txt
