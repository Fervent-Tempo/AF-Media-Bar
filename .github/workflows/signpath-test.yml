# 手动验证主程序的 SignPath 测试签名，产物仅用于接入测试。
name: SignPath test signing

on:
  workflow_dispatch:
    inputs:
      artifact_configuration_slug:
        description: 'SignPath ZIP 配置的 Slug'
        required: true
        default: app-zip
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: signpath-test-${{ github.ref }}
  cancel-in-progress: false

env:
  SIGNPATH_ORGANIZATION_ID: ba451479-242a-4735-abec-068f4ade13da
  SIGNPATH_PROJECT_SLUG: AF-Media-Bar

jobs:
  test-signing:
    name: Build and test-sign (win-x64)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - name: Check signing configuration
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ARTIFACT_CONFIGURATION_SLUG: ${{ inputs.artifact_configuration_slug }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) { throw 'Repository secret SIGNPATH_API_TOKEN is missing.' }
          if ($env:ARTIFACT_CONFIGURATION_SLUG -notmatch '^[A-Za-z0-9._-]+$') { throw 'Invalid artifact configuration slug.' }
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ./src/AFMediaBar.slnx -r win-x64
      - name: Build
        run: dotnet build ./src/AFMediaBar.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:BuildInParallel=false
      - name: Test layout, policies and settings
        run: dotnet test ./tests/AFMediaBar.Layout.Tests/AFMediaBar.Layout.Tests.csproj -c Release --no-build --no-restore
      - name: Publish single-file application
        run: dotnet publish ./src/AFMediaBar/AFMediaBar.csproj -c Release -r win-x64 --self-contained true --no-restore -p:ContinuousIntegrationBuild=true -p:BuildInParallel=false -o ./artifacts/signpath/unsigned
      - name: Read artifact metadata
        id: metadata
        run: |
          $files = @(Get-ChildItem artifacts/signpath/unsigned -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'AFMediaBar.exe') { throw 'Expected only AFMediaBar.exe.' }
          $versionInfo = $files[0].VersionInfo
          if ($versionInfo.ProductName -ne 'AF Media Bar') { throw 'Unexpected product name.' }
          $version = $versionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($version) -or $version -match '[\r\n]') { throw 'Invalid product version.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      # upload-artifact 生成的 ZIP 根目录中只有 AFMediaBar.exe，对应后台 app-zip 配置。
      - name: Upload unsigned application
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: signpath-test-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/signpath/unsigned/AFMediaBar.exe
          if-no-files-found: error
          retention-days: 7
      - name: Submit test signing request
        id: signing
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: test-signing
          artifact-configuration-slug: ${{ inputs.artifact_configuration_slug }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: artifacts/signpath/signed
          parameters: |
            version: ${{ toJSON(steps.metadata.outputs.version) }}
      # 先保存签名产物，后续 Windows 校验失败时仍可下载并排查。
      - name: Upload test-signed application
        uses: actions/upload-artifact@v7
        with:
          name: signpath-test-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/signpath/signed/AFMediaBar.exe
          if-no-files-found: error
          retention-days: 7
      - name: Verify test signature and write report
        timeout-minutes: 5
        env:
          SIGNING_REQUEST_ID: ${{ steps.signing.outputs.signing-request-id }}
          SIGNING_REQUEST_URL: ${{ steps.signing.outputs.signing-request-web-url }}
          EXPECTED_PRODUCT_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          Write-Host 'Checking signed artifact metadata.'
          $files = @(Get-ChildItem artifacts/signpath/signed -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].FullName -ne (Join-Path $PWD 'artifacts/signpath/signed/AFMediaBar.exe')) { throw 'Expected only the signed AFMediaBar.exe at the artifact root.' }
          $exe = $files[0]
          if ($exe.VersionInfo.ProductName -ne 'AF Media Bar' -or $exe.VersionInfo.ProductVersion -ne $env:EXPECTED_PRODUCT_VERSION) { throw 'Signed application metadata differs from the build.' }
          Write-Host 'Reading the Authenticode signature.'
          $signature = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          $certificate = $signature.SignerCertificate
          if (-not $certificate) { throw 'The returned application has no Authenticode signer certificate.' }
          if ($certificate.Subject -ne $certificate.Issuer) { throw 'Expected a self-signed test certificate.' }

          # 在临时管理员 runner 的机器存储中导入，避免用户 Root 存储的交互提示；校验后移除。
          $certificatePath = Join-Path $env:RUNNER_TEMP 'signpath-test-signer.cer'
          $rootPath = "Cert:\LocalMachine\Root\$($certificate.Thumbprint)"
          Write-Host "Preparing temporary trust for test certificate $($certificate.Thumbprint)."
          $alreadyTrusted = Test-Path -LiteralPath $rootPath
          Export-Certificate -Cert $certificate -FilePath $certificatePath -Confirm:$false | Out-Null
          try {
            if (-not $alreadyTrusted) {
              Write-Host 'Importing the test certificate into the temporary runner machine root store.'
              Import-Certificate -FilePath $certificatePath -CertStoreLocation Cert:\LocalMachine\Root -Confirm:$false | Out-Null
            }
            Write-Host 'Verifying the Authenticode signature with temporary test certificate trust.'
            $signature = Get-AuthenticodeSignature -LiteralPath $exe.FullName
            Write-Host "Signature verification returned $($signature.Status)."
            if ($signature.Status -ne 'Valid') { throw "Test signature verification failed: $($signature.Status) - $($signature.StatusMessage)" }
          }
          finally {
            if (-not $alreadyTrusted -and (Test-Path -LiteralPath $rootPath)) {
              Write-Host 'Removing temporary test certificate trust.'
              Remove-Item -LiteralPath $rootPath -Force -Confirm:$false
            }
          }

          Write-Host 'Writing the signature report.'
          $report = [ordered]@{
            purpose = 'Test signing only; not a production release'
            commit = $env:GITHUB_SHA
            productVersion = $exe.VersionInfo.ProductVersion
            signingRequestId = $env:SIGNING_REQUEST_ID
            signingRequestUrl = $env:SIGNING_REQUEST_URL
            signatureStatusWithTestCertificateTrusted = $signature.Status.ToString()
            signerSubject = $certificate.Subject
            signerThumbprint = $certificate.Thumbprint
            hasTimestamp = ($null -ne $signature.TimeStamperCertificate)
            sha256 = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $report | ConvertTo-Json | Set-Content artifacts/signpath/signature-report.json -Encoding utf8
          @(
            '## SignPath 测试签名'
            ''
            '产物使用自签名测试证书，仅用于接入验证，不能作为正式版本发布。'
            ''
            "产品版本：$($report.productVersion)"
            "签名校验：$($report.signatureStatusWithTestCertificateTrusted)（临时信任测试证书后）"
            "签名请求：$env:SIGNING_REQUEST_URL"
            "SHA-256：$($report.sha256)"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Upload signature report
        uses: actions/upload-artifact@v7
        with:
          name: signpath-test-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/signpath/signature-report.json
          if-no-files-found: error
          retention-days: 7
