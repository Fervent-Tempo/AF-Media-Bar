[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
license = "MIT"

[workspace.dependencies]
windows = { version = "*", features = [] }
windows-core = "*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"
